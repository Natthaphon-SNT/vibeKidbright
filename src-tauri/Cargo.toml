[package]
name = "vibe-kidbright"
version = "3.7.3"
description = "VibeKidbright IDE - a kid-friendly AI-assisted IDE for KidBright32 boards"
authors = ["Natthaphon-SNT <zfrankenz123@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.1", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "rustls-tls", "cookies", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
rfd = "0.15"
scraper = "0.22"
urlencoding = "2.1"
serialport = "4.8"
regex = "1"
dunce = "1"
zip = "9"                    # Patched archive reader; retain guarded extraction.
directories = "5.0"          # สำหรับหาโฟลเดอร์ AppData ของผู้ใช้
base64 = "0.22"              # สำหรับ decode firmware binary จาก cloud build API
keyring = { version = "3", features = ["windows-native", "apple-native"] }
similar = "2"               # Myers diff algorithm สำหรับ diff_file tool ที่แม่นยำกว่า
sha2 = "0.10"              # Stable knowledge/source/model fingerprints (already transitively locked)
tree-sitter = "=0.27.1"
tree-sitter-c = "=0.24.2"
# ── RAG Upgrade: Local Embedding + SQLite Vector Store ──────────────────────
fastembed = { version = "4", default-features = false, features = ["ort-download-binaries"] }
rusqlite = { version = "0.32", features = ["bundled"] }  # SQLite with bundled libsqlite3
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"              # Temporary directories for unit tests (kb_store tests)
