name: Build macOS 3.7.1 SDK Repair
on:
  push:
    branches: [ hotfix/3.7.1 ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-original-3.7.1
      - run: npm ci
      - name: Verify 3.7.1 release scope
        run: npm run check:hotfix
      - name: Test frontend and Mac setup
        run: npm test
      - name: Test native environment regressions
        working-directory: src-tauri
        run: cargo test --lib esp_idf::environment --locked
      - name: Build repaired 3.7.1 DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg -- --locked
      - name: Prepare installer and checksum
        run: |
          mkdir -p installer
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg installer/VibeKidbright-IDE_3.7.1_macos-repair_universal.dmg
          cd installer
          shasum -a 256 *.dmg > SHA256SUMS-macos-3.7.1-repair.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vibeKidbright-macOS-3.7.1-repair
          path: installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vibeKidbright-macOS-3.7.1-repair
          path: installer
      - name: Install native SDK with the in-app instructions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source=Path('src/MacosSdkSetup.tsx').read_text(encoding='utf-8')
          commands=re.search(r'export const MACOS_SDK_SETUP = `(.*?)`;',source,re.DOTALL).group(1)
          Path('native-sdk.sh').write_text(commands+'\n',encoding='utf-8')
          PY
          /bin/bash native-sdk.sh
      - name: Check installed version, native firmware build and GUI startup
        run: python3 scripts/verify-macos-repair.py --installer installer --architecture '${{ matrix.arch }}' --report verification/macos-3.7.1-repair-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macOS-3.7.1-repair-check-${{ matrix.arch }}
          path: verification/
          if-no-files-found: error
  release:
    needs: [build,verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibeKidbright-macOS-3.7.1-repair
          path: installer
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.7.1-macos-repair
          target_commitish: ${{ github.sha }}
          make_latest: false
          name: 'vibeKidbright 3.7.1 macOS SDK repair'
          body: |
            App version remains 3.7.1. Native macOS SDK fixes backported from the tested repair.
            Supports Intel and Apple Silicon. Setup / Repair ESP-IDF > Copy macOS Setup > Check Native SDK.
            Native firmware build and GUI startup checked on both CPU architectures; USB flash not tested.
          draft: true
          prerelease: true
          fail_on_unmatched_files: true
          files: installer/*
