name: Build macOS Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_APPLE_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: main_repo/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main_repo/src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: main_repo
        run: npm ci

      - name: Check repository public readiness
        working-directory: main_repo
        run: npm run check:public

      - name: Prepare bundled offline model
        working-directory: main_repo
        run: npm run prepare:runtime -- --download

      - name: Synchronize audited repository knowledge base
        working-directory: main_repo
        run: npm run sync:kb

      - name: Verify clean installer resources
        working-directory: main_repo
        run: npm run check:bundle

      - name: Get app version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('main_repo/src-tauri/tauri.conf.json')); print(d['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ─── Code Signing Setup (ต้องการ Apple Developer secrets) ────────────────
      # ถ้าไม่มี secrets เหล่านี้ step นี้จะถูกข้ามไปโดยอัตโนมัติ
      - name: Import Apple Developer Certificate
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # สร้าง keychain ชั่วคราว
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode และ import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"
          echo "✅ Certificate imported successfully"

      # ─── Run Frontend Unit Tests (vitest) ────────────────────────────────────
      - name: Run frontend unit tests
        working-directory: main_repo
        run: npm test

      # ─── Run Rust Unit Tests ──────────────────────────────────────────────────
      - name: Run Rust unit tests
        working-directory: main_repo/src-tauri
        run: cargo test --lib -- --nocapture

      - name: Configure available Apple signing credentials
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            if [ -z "$SIGNING_IDENTITY" ]; then
              echo "An imported Apple certificate requires APPLE_SIGNING_IDENTITY" >&2
              exit 1
            fi
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          else
            # Tauri supports ad-hoc signing when no Apple certificate is configured.
            printf 'APPLE_SIGNING_IDENTITY=-\n' >> "$GITHUB_ENV"
          fi
          if [ "$HAS_APPLE_CERT" = "true" ] && [ "$HAS_APPLE_NOTARY_CREDENTIALS" = "true" ]; then
            printf 'APPLE_ID=%s\n' "$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_PASSWORD=%s\n' "$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
          fi

      # ─── Build Tauri App ──────────────────────────────────────────────────────
      - name: Build Tauri App (Universal Binary — Apple Silicon + Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: main_repo
          args: --target universal-apple-darwin

      # ─── Notarize ไฟล์ DMG (ต้องการ Apple ID secrets) ───────────────────────
      - name: Notarize DMG with Apple Notary Service
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY_CREDENTIALS == 'true' }}
        run: |
          DMG=$(find main_repo/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ ไม่พบไฟล์ .dmg"
            exit 1
          fi
          echo "📦 Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$DMG"
          echo "✅ Notarization complete"

      # ─── Release ─────────────────────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: 'vibeKidbright ${{ steps.get_version.outputs.TAG }} (macOS)'
          body: 'ดาวน์โหลดไฟล์ .dmg ด้านล่างเพื่อติดตั้งบน macOS (รองรับทั้ง Apple Silicon และ Intel)'
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            main_repo/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
