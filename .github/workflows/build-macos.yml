name: Build macOS Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      source_ref:
        description: 'Leave blank for repaired current source; v3.7.1 builds the original release'
        type: choice
        default: ''
        options: ['', v3.7.1]
      installer_run:
        description: 'Existing 3.7.4 artifact run ID, only for repeating installation checks'
        type: string
        default: ''

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: ${{ inputs.source_ref != 'v3.7.1' && inputs.installer_run == '' }}
    runs-on: macos-15
    timeout-minutes: 90
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
      tag: ${{ steps.get_version.outputs.TAG }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERTIFICATE != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' && secrets.KEYCHAIN_PASSWORD != '' }}
      HAS_APPLE_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_ID_PASSWORD != '' && secrets.APPLE_TEAM_ID != '' }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: main_repo/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
          components: clippy

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main_repo/src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: main_repo
        run: npm ci

      - name: Test installer verification helpers
        working-directory: main_repo
        run: python3 -m unittest discover -s scripts/tests -p 'test_macos_installer.py' -v

      - name: Check repository public readiness
        working-directory: main_repo
        run: npm run check:public

      - name: Prepare bundled offline model
        working-directory: main_repo
        run: npm run prepare:runtime -- --download

      - name: Synchronize audited repository knowledge base
        working-directory: main_repo
        run: npm run sync:kb

      - name: Verify clean installer resources
        working-directory: main_repo
        run: npm run check:bundle

      - name: Get app version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('main_repo/src-tauri/tauri.conf.json')); print(d['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      # ─── Code Signing Setup (ต้องการ Apple Developer secrets) ────────────────
      # ถ้าไม่มี secrets เหล่านี้ step นี้จะถูกข้ามไปโดยอัตโนมัติ
      - name: Import Apple Developer Certificate
        if: ${{ env.HAS_APPLE_CERT == 'true' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # สร้าง keychain ชั่วคราว
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode และ import certificate
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"
          echo "✅ Certificate imported successfully"

      # ─── Run Frontend Unit Tests (vitest) ────────────────────────────────────
      - name: Run frontend unit tests
        working-directory: main_repo
        run: npm test

      # ─── Run Rust Unit Tests ──────────────────────────────────────────────────
      - name: Run Rust tests (library, binaries and examples on runner host)
        working-directory: main_repo/src-tauri
        run: cargo test --all-targets --locked -- --nocapture

      - name: Check Rust targets with Clippy on runner host
        working-directory: main_repo/src-tauri
        run: cargo clippy --all-targets --locked

      - name: Configure available Apple signing credentials
        env:
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ "$HAS_APPLE_CERT" = "true" ]; then
            if [ -z "$SIGNING_IDENTITY" ]; then
              echo "An imported Apple certificate requires APPLE_SIGNING_IDENTITY" >&2
              exit 1
            fi
            printf 'APPLE_SIGNING_IDENTITY=%s\n' "$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          else
            # Tauri supports ad-hoc signing when no Apple certificate is configured.
            printf 'APPLE_SIGNING_IDENTITY=-\n' >> "$GITHUB_ENV"
          fi
          if [ "$HAS_APPLE_CERT" = "true" ] && [ "$HAS_APPLE_NOTARY_CREDENTIALS" = "true" ]; then
            printf 'APPLE_ID=%s\n' "$NOTARY_APPLE_ID" >> "$GITHUB_ENV"
            printf 'APPLE_PASSWORD=%s\n' "$NOTARY_PASSWORD" >> "$GITHUB_ENV"
            printf 'APPLE_TEAM_ID=%s\n' "$NOTARY_TEAM_ID" >> "$GITHUB_ENV"
          fi

      # ─── Build Tauri App ──────────────────────────────────────────────────────
      - name: Build Tauri App (Universal Binary — Apple Silicon + Intel)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: main_repo
          args: --target universal-apple-darwin --bundles dmg -- --locked

      # ─── Notarize ไฟล์ DMG (ต้องการ Apple ID secrets) ───────────────────────
      - name: Notarize DMG with Apple Notary Service
        if: ${{ env.HAS_APPLE_CERT == 'true' && env.HAS_APPLE_NOTARY_CREDENTIALS == 'true' }}
        env:
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find main_repo/src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -1)
          if [ -z "$DMG" ]; then
            echo "❌ ไม่พบไฟล์ .dmg"
            exit 1
          fi
          echo "📦 Notarizing: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$NOTARY_APPLE_ID" \
            --password "$NOTARY_PASSWORD" \
            --team-id "$NOTARY_TEAM_ID" \
            --wait \
            --timeout 30m
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          echo "✅ Notarization complete"

      - name: Checksum the final installer
        working-directory: main_repo/src-tauri/target/universal-apple-darwin/release/bundle/dmg
        env:
          APP_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          images = list(Path('.').glob('*.dmg'))
          if len(images) != 1:
              raise SystemExit('Expected exactly one final DMG')
          # GitHub release assets normalize spaces; use the same name everywhere.
          target = Path(f"VibeKidbright-IDE_{os.environ['APP_VERSION']}_universal.dmg")
          if images[0] != target:
              images[0].rename(target)
          with target.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          Path('SHA256SUMS-macos.txt').write_text(f'{digest}  {target.name}\n', encoding='utf-8')
          PY

      # Make the DMG downloadable even while the GitHub release is still a draft.
      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: vibeKidbright-macOS-${{ steps.get_version.outputs.VERSION }}-universal
          path: |
            main_repo/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            main_repo/src-tauri/target/universal-apple-darwin/release/bundle/dmg/SHA256SUMS-macos.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Remove temporary Apple signing keychain
        if: ${{ always() && env.HAS_APPLE_CERT == 'true' }}
        run: |
          if [ -f "$RUNNER_TEMP/build.keychain" ]; then
            security delete-keychain "$RUNNER_TEMP/build.keychain"
          fi
          rm -f "$RUNNER_TEMP/cert.p12"

  verify-installation:
    if: ${{ always() && inputs.source_ref != 'v3.7.1' && (needs.build.result == 'success' || inputs.installer_run != '') }}
    name: Install and launch (${{ matrix.arch }})
    needs: build
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    steps:
      - name: Checkout verification scripts
        uses: actions/checkout@v4

      - name: Download the universal installer
        uses: actions/download-artifact@v4
        with:
          name: vibeKidbright-macOS-${{ needs.build.outputs.version || '3.7.4' }}-universal
          path: installer
          run-id: ${{ inputs.installer_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install native ESP-IDF using the in-app macOS setup instructions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('src/MacosSdkSetup.tsx').read_text(encoding='utf-8')
          commands = re.search(r'export const MACOS_SDK_SETUP = `(.*?)`;', source, re.DOTALL).group(1)
          Path('macos-sdk-setup.sh').write_text(commands + '\n', encoding='utf-8')
          PY
          /bin/bash macos-sdk-setup.sh

      - name: Verify copied installation without developer tools
        env:
          CI_KEYCHAIN: ${{ runner.temp }}/vibekidbright-probe.keychain-db
        run: |
          python3 - <<'PY'
          import os, secrets, subprocess
          password = secrets.token_urlsafe(32)
          path = os.environ['CI_KEYCHAIN']
          for arguments in [
              ['create-keychain', '-p', password, path],
              ['set-keychain-settings', '-lut', '3600', path],
              ['unlock-keychain', '-p', password, path],
              ['default-keychain', '-d', 'user', '-s', path],
              ['list-keychains', '-d', 'user', '-s', path],
          ]:
              subprocess.run(['/usr/bin/security', *arguments], check=True, capture_output=True)
          PY
          python3 scripts/test-macos-installer.py \
            --installer-directory installer \
            --report verification/macos-installation-check-${{ matrix.arch }}.json \
            --expected-version '${{ needs.build.outputs.version || '3.7.4' }}' \
            --expected-arch '${{ matrix.arch }}' \
            --sdk-idf "$HOME/esp/esp-idf-v5.5.1" \
            --sdk-tools "$HOME/.vibekidbright/.espressif"

      - name: Remove temporary installation probe keychain
        if: ${{ always() }}
        run: |
          if [ -f "$RUNNER_TEMP/vibekidbright-probe.keychain-db" ]; then
            security delete-keychain "$RUNNER_TEMP/vibekidbright-probe.keychain-db"
          fi

      # Native probe details remain in the uploaded report and SDK/startup logs.
      - name: Record installation verification completed
        run: >-
          test -s verification/macos-installation-check-${{ matrix.arch }}.json

      - name: Upload installation verification and startup logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: macOS-installation-check-${{ matrix.arch }}
          path: verification/
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ always() && needs.verify-installation.result == 'success' }}
    needs: [build, verify-installation]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download verified installer
        uses: actions/download-artifact@v4
        with:
          name: vibeKidbright-macOS-${{ needs.build.outputs.version || '3.7.4' }}-universal
          path: installer
          run-id: ${{ inputs.installer_run || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download installation reports
        uses: actions/download-artifact@v4
        with:
          pattern: macOS-installation-check-*
          path: verification
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.tag || 'v3.7.4' }}
          target_commitish: ${{ github.sha }}
          name: "vibeKidbright ${{ needs.build.outputs.tag || 'v3.7.4' }}"
          body: |
            macOS: ดาวน์โหลด Universal .dmg แล้วลาก VibeKidbright IDE ไปไว้ใน Applications (Apple Silicon และ Intel)
            ตรวจ SHA-256 ด้วย SHA256SUMS-macos.txt; แนบผล self-check และ startup ของทั้งสองสถาปัตยกรรม
            ถ้ายังไม่ได้ notarize ให้ทำตาม docs/macos-installer-setup.md เพื่ออนุญาตแอปใน Privacy & Security
          append_body: true
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            installer/*.dmg
            installer/SHA256SUMS-macos.txt
            verification/*.json

  legacy-build:
    if: ${{ inputs.source_ref == 'v3.7.1' }}
    runs-on: macos-15
    timeout-minutes: 90
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      APPLE_SIGNING_IDENTITY: '-'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v3.7.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: macos-original-3.7.1
      - name: Verify original release version
        run: |
          node -e "if(require('./package.json').version !== '3.7.1') process.exit(1)"
          git rev-parse HEAD > source-revision.txt
      - run: npm ci
      - name: Build original 3.7.1 universal DMG
        run: npm run tauri -- build --target universal-apple-darwin --bundles dmg -- --locked
      - name: Prepare release assets and provenance
        run: |
          mkdir -p installer
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg installer/VibeKidbright-IDE_3.7.1_universal.dmg
          cp source-revision.txt installer/macos-3.7.1-source-revision.txt
          cd installer
          shasum -a 256 *.dmg > SHA256SUMS-macos-3.7.1.txt
      - uses: actions/upload-artifact@v4
        with:
          name: vibeKidbright-macOS-3.7.1-universal
          path: installer/
          if-no-files-found: error
          compression-level: 0
          retention-days: 90

  legacy-verify:
    needs: legacy-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vibeKidbright-macOS-3.7.1-universal
          path: installer
      - name: Verify original release installation and startup
        run: python3 scripts/verify-legacy-macos.py --installer installer --architecture '${{ matrix.arch }}' --report verification/macos-3.7.1-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: macOS-3.7.1-check-${{ matrix.arch }}
          path: verification/
          if-no-files-found: error

  legacy-release:
    needs: [legacy-build, legacy-verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vibeKidbright-macOS-3.7.1-universal
          path: installer
      - uses: actions/download-artifact@v4
        with:
          pattern: macOS-3.7.1-check-*
          path: verification
          merge-multiple: true
      - name: Attach original macOS installer to existing 3.7.1 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload v3.7.1 installer/* verification/*.json
