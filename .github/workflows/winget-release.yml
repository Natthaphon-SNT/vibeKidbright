name: Submit to winget on Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published release tag to submit (for example v3.7.3)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  winget:
    if: github.event_name == 'workflow_dispatch' || (!github.event.release.prerelease && !github.event.release.draft)
    runs-on: windows-latest
    steps:
      # Validate the separate PAT before fork synchronization.
      - uses: actions/checkout@v4
      - name: Validate WINGET_TOKEN scopes
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: ./scripts/check-winget-token.ps1
        shell: pwsh

      # ── Submit to winget-pkgs via vedantmgoyal9/winget-releaser ────────────
      # This action:
      #   1. Detects the release assets (.exe/.msi) automatically
      #   2. Computes their SHA256 hashes
      #   3. Updates the manifest YAML files
      #   4. Opens a Pull Request to microsoft/winget-pkgs
      #
      # Prerequisites (one-time setup):
      #   - Fork https://github.com/microsoft/winget-pkgs to your own GitHub account
      #   - Create a classic PAT with public_repo + workflow for fork sync
      #   - Add the PAT as repository secret: Settings → Secrets → WINGET_TOKEN
      #   - The first submission must be manually approved by the winget team
      - name: Submit to winget
        uses: vedantmgoyal9/winget-releaser@v2
        with:
          identifier: Natthaphon-SNT.vibeKidbright
          token: ${{ secrets.WINGET_TOKEN }}
          release-tag: ${{ inputs.release_tag || github.event.release.tag_name }}
          # Match the Windows x64 NSIS installer, excluding portable executables.
          installers-regex: '(?i)_x64-setup\.exe$'
