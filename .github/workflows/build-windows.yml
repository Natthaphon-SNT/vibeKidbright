name: Build Windows Installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Checkout external knowledge_base repo
        uses: actions/checkout@v4
        with:
          repository: Natthaphon-SNT/Knowledge
          path: external_repo

      - name: Extract external knowledge_base.zip
        run: |
          $zip = "external_repo/knowledge_base.zip"
          if (-not (Test-Path $zip)) { Write-Error "ไม่พบไฟล์ $zip"; exit 1 }
          Expand-Archive -Path $zip -DestinationPath "external_repo/extracted" -Force
        shell: pwsh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: main_repo/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main_repo/src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: main_repo
        run: npm ci

      - name: Merge knowledge_base from both repos
        run: |
          $dst = "main_repo/resources/knowledge_base"
          if (-not (Test-Path $dst)) { New-Item -ItemType Directory -Path $dst -Force }

          function Sync-KnowledgeBase($src) {
            if (-not (Test-Path $src)) { Write-Host "Skipping $src (not found)"; return }
            Get-ChildItem $src -Recurse -File | Where-Object {
              $_.Name -ne ".embeddings.json" -and -not $_.Name.EndsWith(".backup")
            } | ForEach-Object {
              $rel = $_.FullName.Substring((Resolve-Path $src).Path.Length + 1)
              $dstFile = Join-Path $dst $rel
              $dstDir = Split-Path $dstFile -Parent
              if (-not (Test-Path $dstDir)) { New-Item -ItemType Directory -Path $dstDir -Force | Out-Null }
              Copy-Item $_.FullName $dstFile -Force
            }
          }

          Sync-KnowledgeBase "external_repo/extracted/knowledge_base"
          Sync-KnowledgeBase "main_repo/knowledge_base"
          Write-Host "Merge complete -> $dst"
        shell: pwsh

      - name: Get app version from tauri.conf.json
        id: get_version
        run: |
          $json = Get-Content "main_repo/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $json.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
        shell: pwsh

      - name: Decode PFX Certificate
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String("${{ secrets.CERT_PFX_BASE64 }}")
          [IO.File]::WriteAllBytes("cert.pfx", $pfx_cert_byte)
        shell: pwsh

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: main_repo

      - name: Sign installer
        run: |
          $installer = Get-ChildItem "main_repo\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          Write-Host "Signing: $($installer.FullName)"
          & "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\signtool.exe" sign `
            /f cert.pfx `
            /p "${{ secrets.CERT_PASSWORD }}" `
            /fd SHA256 `
            /t "http://timestamp.digicert.com" `
            "$($installer.FullName)"
          Remove-Item "cert.pfx"
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: 'vibeKidbright ${{ steps.get_version.outputs.TAG }} (Windows)'
          body: 'ดาวน์โหลดไฟล์ .exe ด้านล่างเพื่อติดตั้งบน Windows'
          draft: true
          prerelease: false
          files: |
            main_repo/src-tauri/target/release/bundle/nsis/*.exe
            main_repo/src-tauri/target/release/bundle/msi/*.msi