name: Build Windows Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch: # อนุญาตให้กดสั่งรันด้วยตัวเองได้บนหน้าเว็บ

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        run: npm install

      - name: Sync knowledge_base to resources
        run: |
          $src = "knowledge_base"
          $dst = "resources/knowledge_base"
          if (-not (Test-Path $dst)) { New-Item -ItemType Directory -Path $dst -Force }
          Get-ChildItem $src -Recurse -File | Where-Object {
            $_.Name -ne ".embeddings.json" -and -not $_.Name.EndsWith(".backup")
          } | ForEach-Object {
            $rel = $_.FullName.Substring((Resolve-Path $src).Path.Length + 1)
            $dstFile = Join-Path $dst $rel
            $dstDir = Split-Path $dstFile -Parent
            if (-not (Test-Path $dstDir)) { New-Item -ItemType Directory -Path $dstDir -Force | Out-Null }
            Copy-Item $_.FullName $dstFile -Force
          }
          Write-Host "Knowledge base synced to resources/"
        shell: pwsh

      - name: Build and Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__ # ดึงเวอร์ชันจาก tauri.conf.json อัตโนมัติ
          releaseName: 'vibeKidbright v__VERSION__ (Windows)'
          releaseBody: 'ดาวน์โหลดไฟล์ .msi หรือ .exe ด้านล่างเพื่อติดตั้งบน Windows'
          releaseDraft: true # สร้างเป็น Draft ไว้ก่อน เผื่อให้คุณเข้าไปตรวจสอบก่อนกด Publish
          prerelease: false
