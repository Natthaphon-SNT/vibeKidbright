name: Build Windows Installer
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      HAS_WINDOWS_CERT: ${{ secrets.CERT_PFX_BASE64 != '' && secrets.CERT_PASSWORD != '' }}
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: main_repo/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main_repo/src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: main_repo
        run: npm ci

      - name: Check repository public readiness
        working-directory: main_repo
        run: npm run check:public

      - name: Prepare bundled offline model and runtime
        working-directory: main_repo
        run: npm run prepare:runtime -- --download

      - name: Synchronize audited repository knowledge base
        working-directory: main_repo
        run: npm run sync:kb

      - name: Verify clean installer resources
        working-directory: main_repo
        run: npm run check:bundle

      - name: Get app version from tauri.conf.json
        id: get_version
        run: |
          $json = Get-Content "main_repo/src-tauri/tauri.conf.json" | ConvertFrom-Json
          $version = $json.version
          echo "VERSION=$version" >> $env:GITHUB_OUTPUT
          echo "TAG=v$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"
        shell: pwsh

      - name: Decode PFX Certificate
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        env:
          CERT_PFX_BASE64: ${{ secrets.CERT_PFX_BASE64 }}
        run: |
          $pfx_cert_byte = [System.Convert]::FromBase64String($env:CERT_PFX_BASE64)
          [IO.File]::WriteAllBytes("cert.pfx", $pfx_cert_byte)
        shell: pwsh

      # ─── Run Frontend Unit Tests (vitest) ────────────────────────────────────
      - name: Run frontend unit tests
        working-directory: main_repo
        run: npm test
        shell: pwsh

      # ─── Run Rust Unit Tests ──────────────────────────────────────────────────
      - name: Run Rust unit tests
        working-directory: main_repo/src-tauri
        run: cargo test --lib -- --nocapture
        shell: pwsh

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: main_repo

      - name: Sign installer
        if: ${{ env.HAS_WINDOWS_CERT == 'true' }}
        env:
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
        run: |
          $installer = Get-ChildItem "main_repo\src-tauri\target\release\bundle\nsis\*.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer not found" }

          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $kitsRoot = Join-Path ([Environment]::GetFolderPath("ProgramFilesX86")) "Windows Kits\10\bin"
            $signtool = Get-ChildItem -Path $kitsRoot -Filter signtool.exe -Recurse -File -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match '\\x64\\signtool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if (-not $signtool) { throw "signtool.exe was not found in PATH or Windows SDK directories" }

          Write-Host "Signing: $($installer.FullName)"
          & $signtool sign `
            /f cert.pfx `
            /p $env:CERT_PASSWORD `
            /fd SHA256 `
            /t "http://timestamp.digicert.com" `
            "$($installer.FullName)"
        shell: pwsh

      - name: Remove temporary signing certificate
        if: ${{ always() }}
        run: |
          if (Test-Path "cert.pfx") { Remove-Item -LiteralPath "cert.pfx" -Force }
        shell: pwsh

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: 'vibeKidbright ${{ steps.get_version.outputs.TAG }} (Windows)'
          body: 'ดาวน์โหลดไฟล์ .exe ด้านล่างเพื่อติดตั้งบน Windows'
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            main_repo/src-tauri/target/release/bundle/nsis/*.exe
            main_repo/src-tauri/target/release/bundle/msi/*.msi
