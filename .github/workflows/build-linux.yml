name: Build Linux Installer

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # ubuntu-22.04 keeps the glibc baseline low so the AppImage/deb run on more distros.
    runs-on: ubuntu-22.04
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main_repo

      - name: Install Linux system dependencies (Tauri v2)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libxdo-dev \
            patchelf \
            xdg-utils \
            file

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: main_repo/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: main_repo/src-tauri -> target

      - name: Install Frontend Dependencies
        working-directory: main_repo
        run: npm ci

      - name: Check repository public readiness
        working-directory: main_repo
        run: npm run check:public

      - name: Prepare bundled offline model
        working-directory: main_repo
        run: npm run prepare:runtime -- --download

      - name: Synchronize audited repository knowledge base
        working-directory: main_repo
        run: npm run sync:kb

      - name: Verify clean installer resources
        working-directory: main_repo
        run: npm run check:bundle

      - name: Get app version from tauri.conf.json
        id: get_version
        run: |
          VERSION=$(python3 -c "import json; d=json.load(open('main_repo/src-tauri/tauri.conf.json')); print(d['version'])")
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "TAG=v$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Run frontend unit tests
        working-directory: main_repo
        run: npm test

      - name: Run Rust unit tests
        working-directory: main_repo/src-tauri
        run: cargo test --lib -- --nocapture

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: main_repo
          args: --bundles deb,rpm,appimage

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          target_commitish: ${{ github.sha }}
          name: 'vibeKidbright ${{ steps.get_version.outputs.TAG }} (Linux)'
          body: 'Download the .AppImage (any distro), .deb (Debian/Ubuntu) or .rpm (Fedora/openSUSE) below to install on Linux.'
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            main_repo/src-tauri/target/release/bundle/appimage/*.AppImage
            main_repo/src-tauri/target/release/bundle/deb/*.deb
            main_repo/src-tauri/target/release/bundle/rpm/*.rpm
