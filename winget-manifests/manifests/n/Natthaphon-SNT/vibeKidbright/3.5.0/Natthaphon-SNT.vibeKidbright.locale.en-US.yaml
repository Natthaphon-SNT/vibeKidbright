ShortDescription: AI-powered ESP-IDF IDE for KidBright32 and ESP32 boards, built with Tauri + React.
Description: |-
  vibeKidbright IDE is a modern AI-powered desktop IDE for developing ESP-IDF firmware.
  It supports ESP32, KidBright32, and KidBright μAI Plus boards.
  Features include: AI coding assistant (Vibe Coder), built-in terminal, one-click build/flash/monitor,
  Monaco code editor, local Knowledge Base for KidBright/ESP-IDF docs, and multi-provider AI support
  (OpenAI, Google Gemini, OpenRouter, local LLMs via Ollama/LM Studio).
